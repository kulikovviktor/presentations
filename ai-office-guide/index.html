<script>
'use strict';
const sources={

const rect=(x,y,w,h,cls='box',r=12)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" class="${cls}"/>`;

let svgId=0;
const svg=(body,label,view='0 0 660 370')=>{const id=++svgId;return `<svg class="diagram" viewBox="${view}" role="img" aria-label="${label}"><defs><marker id="arrow${id}" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#1d6550"/></marker></defs>${body.replaceAll('url(#arrow)',`url(#arrow${id})`)}</svg>`};
const person=(x,y,active=false)=>`<g transform="translate(${x} ${y})"><circle cx="0" cy="-10" r="8" fill="${active?'#1d6550':'#a3afa3'}"/><path d="M-14 18v-7a14 14 0 0 1 28 0v7" fill="${active?'#1d6550':'#a3afa3'}"/></g>`;
const office=()=>svg(`${rect(105,25,450,290,'box',6)}${rect(105,25,450,49,'hot',6)}${txt(330,57,'ОФИС МОДЕЛИ','label')}${line(105,144,555,144)}${line(105,218,555,218)}${line(105,290,555,290)}${txt(135,115,'3','hint')}${txt(135,189,'2','hint')}${txt(135,263,'1','hint')}${[100,174,248].map((y,i)=>`${rect(175,y-9,130,34,i===1?'selected':'box',5)}${txt(240,y+14,'Внимание','hint')}${[365,420,475].map((x,j)=>person(x,y+4,i===1&&j!==1)).join('')}`).join('')}${rect(285,317,90,41,'hot',3)}${txt(330,343,'Текст','hint')}${arrow(330,317,330,281)}${txt(330,390,'Каждый этаж обрабатывает информацию','hint')}`,'Условный офис с последовательными слоями обработки','0 0 660 410');
const slides=[];
function add(chapter,title,copy,visual,take,notes,refs=[],opts={}){slides.push({chapter,title,copy,visual,take,notes,refs,...opts});}

add('История для тех, кто далёк от IT','Как работает ИИ',`<p>Один день в большом офисе, который пишет ответы.</p><p class="cover-label">Понятные схемы, несколько интерактивных примеров и объяснение каждого шага.</p>`,office(),'','Офис — условная аналогия. Люди на схеме обозначают вычислительные блоки. Фронтирными обычно называют модели среди наиболее способных на момент оценки. Рассказ объясняет опубликованные принципы языковых моделей и систем вокруг них. Конкретные реализации различаются.',['transformer','moe'],{cover:true});

add('01 / Что мы представляем','Модель внутри помощника',`<p>Представим модель как <strong>большой офис обработки текста</strong>.</p><p>Вокруг него есть приложение: оно передаёт сообщения, подключает файлы, поиск и другие инструменты.</p><p class="small">Дальше разберём офис с трансформером и MoE. Такой вариант устройства используют некоторые модели.</p>`,svg(`${rect(20,30,620,305,'box',18)}${txt(330,66,'Приложение-помощник')}${rect(185,94,290,115,'selected')}${txt(330,135,'Модель','large')}${txt(330,170,'Вычисляет ответ','hint')}${[['История',35],['Файлы',195],['Поиск',355],['Калькулятор',515]].map(([t,x])=>`${rect(x,252,110,49,'box',7)}${txt(x+55,282,t,'hint')}`).join('')}${line(90,252,90,225)}${line(90,225,570,225)}${line(570,225,570,252)}${line(250,252,250,225)}${line(410,252,410,225)}${line(330,225,330,209)}`,'Модель находится внутри приложения, которое подключает историю, файлы и инструменты'),'Ответ зависит и от модели, и от доступной ей информации.','Модель — обученная вычислительная система. Приложение организует обращения к ней, управление контекстом и выполнение команд инструментов. MoE — один из вариантов архитектуры. Есть и плотные модели, например Llama 3 405B.',['agents','llama','moe']);

add('02 / До первого разговора','Офис сначала обучают',`<p>На учебных примерах модель пробует <strong>предсказать следующий кусочек текста</strong>.</p><p>Система оценивает ошибку и немного меняет числовые настройки модели.</p><p class="small">Эти настройки называют параметрами. Процесс повторяют на огромном количестве данных.</p>`,`<div class="stage-row" id="train-stages"><div class="stage current"><div class="num">1</div><h3>Пример</h3><p>Маша раскрыла…</p></div><div class="stage"><div class="num">2</div><h3>Прогноз</h3><p>Вероятности продолжений</p></div><div class="stage"><div class="num">3</div><h3>Проверка</h3><p>В учебном тексте дальше стоит зонт</p></div><div class="stage"><div class="num">4</div><h3>Настройка</h3><p>Параметры немного меняют</p></div></div><div class="actions"><button class="action" id="train-next">Следующий шаг</button><span class="small" id="train-status">Учебный цикл: шаг 1 из 4</span></div>`, 'Обучение меняет параметры, которые затем участвуют в ответах.','Предобучение авторегрессионных языковых моделей включает предсказание следующего токена. Ошибка зависит от вероятности, назначенной фактическому следующему токену. Обратное распространение ошибки и оптимизатор определяют изменения параметров. Пример с зонтом условный.',['llama','training']);

add('03 / После чтения','Модель учат помогать',`<p>После предобучения ей показывают <strong>примеры полезных ответов</strong>.</p><p>Дальше можно сравнивать ответы и поощрять более удачные. В математике и программировании результат часто можно проверить автоматически.</p>`,svg(`${rect(30,35,270,120,'box')}${txt(165,76,'Примеры ответов')}${txt(165,111,'Вопрос и хорошее объяснение','hint')}${rect(360,35,270,120,'box')}${txt(495,76,'Оценка результатов')}${txt(495,111,'Решение прошло проверку?','hint')}${arrow(165,155,165,200)}${arrow(495,155,495,200)}${rect(80,205,500,105,'selected')}${txt(330,249,'Дообучение','large')}${txt(330,282,'Модель лучше следует заданиям','hint')}`,'Примеры ответов и оценка результатов используются для дообучения'),'Навыки помощника формируют отдельными этапами обучения.','В Llama 3 описаны supervised fine-tuning и оптимизация по предпочтениям DPO. DeepSeek-R1 демонстрирует развитие рассуждений с помощью обучения с подкреплением. Набор этапов и способов оценки различается. Поощрение означает изменение обучающей цели и параметров.',['llama','r1']);

add('04 / Начинается разговор','Ты передаёшь задание в офис',`<p>Например: <strong>Маша вышла под дождь и раскрыла…</strong></p><p>Вместе с запросом модель может получить предыдущие сообщения, инструкции и нужные фрагменты документов.</p><p class="small">Всё, что ей передали для текущего ответа, составляет контекст.</p>`,svg(`${rect(20,90,205,155,'hot')}${txt(122,130,'Твоё задание')}${txt(122,168,'Маша вышла','hint')}${txt(122,195,'под дождь…','hint')}${arrow(232,167,295,167)}${rect(310,40,320,255,'box')}${txt(470,80,'Контекст')}${rect(335,105,270,43,'selected',6)}${txt(470,132,'Текущее сообщение','hint')}${rect(335,165,270,43,'box',6)}${txt(470,192,'История и инструкции','hint')}${rect(335,225,270,43,'box',6)}${txt(470,252,'Добавленные материалы','hint')}`,'Задание вместе с доступной историей и материалами образует контекст'),'Модель работает с тем, что попало в её текущий контекст.','Контекст включает переданную модели последовательность данных. История может быть сокращена. Содержимое файлов и результаты поиска доступны модели в той форме и объёме, которые передало приложение. Контекст не означает автоматический доступ ко всем файлам и всему интернету.',['context']);

add('05 / Приёмная','Текст разбирают на карточки',`<p>Каждая карточка соответствует <strong>токену</strong>.</p><p>Это может быть слово, часть слова или знак. Положение карточек помогает учитывать порядок текста.</p><p class="small">Нажми кнопку на схеме: одно из слов в учебной схеме разделится на части.</p>`,`<div class="sentence">Маша раскрыла зонтик.</div><div class="token-row" id="token-demo"></div><div class="actions"><button class="action" id="token-toggle">Показать части слова</button></div><p class="caption">Условное разбиение для объяснения. У настоящей модели токены определяет её токенизатор.</p>`, 'Токен и слово могут иметь разную длину.','Токенизатор преобразует текст в последовательность идентификаторов. На схеме показано только условное разбиение, а подпись места обозначает порядок, а не реальный ID. Способ учёта позиции зависит от архитектуры.',['tokens','transformer']);

add('06 / Карточка изнутри','Модель вычисляет с числами',`<p>Для каждой карточки модель получает <strong>числовое представление</strong>.</p><p>Через эти числа она обрабатывает связи и закономерности, которые выучила.</p><p class="small">Отдельное число обычно нельзя подписать как дождь, доброта или грамматика.</p>`,svg(`${rect(45,95,180,150,'hot')}${txt(135,162,'зонт','large')}${txt(135,198,'токен','hint')}${arrow(235,170,305,170)}${rect(325,62,285,222,'box')}${txt(467,105,'Список чисел')}${['0,18','−0,42','0,73','…'].map((v,i)=>`${rect(354+i*59,137,50,68,i===2?'selected':'box',5)}${txt(379+i*59,179,v,'hint')}`).join('')}${txt(467,252,'Вектор','hint')}`,'Токен получает вектор, условный список чисел'),'Вектор служит представлением, которое меняется по ходу обработки.','Embedding — обучаемое отображение идентификатора токена в вектор. Дальнейшие слои меняют представление с учётом контекста. Числа на схеме полностью условны и не взяты из настоящей модели. Значения и признаки могут быть распределены по множеству направлений представления.',['transformer','interp']);

add('07 / Коридор обработки','Карточки проходят через слои',`<p>В каждой комнате информация проходит очередной этап обработки.</p><p>Следующая комната получает <strong>уже обновлённые представления</strong>. Накопленная информация передаётся дальше.</p><p class="small">В реальной модели слоёв может быть намного больше, чем на этой схеме.</p>`,`<div id="corridor"></div><div class="actions"><button class="action" id="layer-next">Пройти следующую комнату</button><span class="small" id="layer-status">Комната 1 из 4</span></div>`, 'Комнаты выполняют похожие виды операций со своими параметрами.','У трансформера есть последовательность слоёв с вниманием и преобразованиями представлений. Остаточные соединения позволяют добавлять результаты преобразований к текущему представлению. Номер комнаты и четыре блока выбраны для наглядности.',['transformer','llama']);

add('08 / Отдел внимания','Какие слова связаны?',`<p>В предложении справа слово <strong>оно</strong> относится к мороженому.</p><p>Внимание позволяет учитывать информацию из разных позиций с разным весом.</p><p class="small">Несколько механизмов внимания могут учитывать разные связи одновременно.</p>`,`<div class="sentence" id="attention-sentence"><span class="word" data-word="petya">Петя</span> положил <span class="word" data-word="ice">мороженое</span> на <span class="word" data-word="table">стол</span>. Через час <span class="word focus">оно</span> растаяло.</div><div class="attention-lines"><div class="att-col" data-att="petya"><div class="att-bar" style="--h:20px"></div>Петя</div><div class="att-col" data-att="ice"><div class="att-bar" style="--h:20px"></div>мороженое</div><div class="att-col" data-att="table"><div class="att-bar" style="--h:20px"></div>стол</div></div><div class="actions"><button class="action" id="attention-toggle">Показать связь</button></div><p class="caption">Высота столбиков условная. Это схема связи, без измерений настоящей модели.</p>`, 'Информация из одних карточек влияет сильнее, из других слабее.','Self-attention вычисляет веса и смешивает преобразованные значения из доступных позиций. В авторегрессионной модели будущее продолжение скрыто. Здесь анализируется уже переданный текст целиком. Схема не показывает реальные attention weights и не является полным объяснением решения по одной картинке внимания.',['transformer']);

add('09 / Рабочие группы','Диспетчер выбирает экспертов',`<p>В MoE есть много вычислительных групп. <strong>Роутер</strong> выбирает некоторые для текущей карточки.</p><p>В другой комнате выбор может измениться: представление карточки уже обновилось.</p><p class="small">Специализация возникает при обучении. У экспертов нет заранее назначенных человеческих профессий.</p>`,`<div class="router">Роутер · комната <span id="route-room">1</span></div><div class="router-line"></div><div class="route-grid" id="experts"></div><div class="route-status" id="route-status"></div><div class="actions"><button class="action" id="route-next">Выбор в следующей комнате</button></div><p class="caption">12 групп и выбор 3 из них взяты для объяснения. Общие части сети также работают.</p>`, 'MoE сокращает объём экспертных вычислений на один токен.','В MoE роутер выбирает экспертные блоки на основе текущего представления токена. Выходы выбранных экспертов комбинируются. В DeepSeek-V3 также есть общие эксперты. На схеме их нет. MoE не определяет автоматически, что эксперт отвечает за конкретную человеческую область знаний.',['moe']);

add('10 / Выход из коридора','Что написать дальше?',`<p>После обработки модель вычисляет <strong>вероятности следующего токена</strong>.</p><p>Система генерации выбирает продолжение с учётом этих вероятностей и своих настроек.</p><p class="small">Разные способы выбора могут дать разные ответы на одинаковый запрос.</p>`,`<div class="sentence">Маша раскрыла…</div><div class="probrow"><span>зонт</span><div class="probtrack"><div class="probfill" style="--w:75%"></div></div><span>75%</span></div><div class="probrow"><span>книгу</span><div class="probtrack"><div class="probfill" style="--w:15%"></div></div><span>15%</span></div><div class="probrow"><span>тайну</span><div class="probtrack"><div class="probfill" style="--w:7%"></div></div><span>7%</span></div><div class="probrow"><span>остальное</span><div class="probtrack"><div class="probfill" style="--w:3%"></div></div><span>3%</span></div><p class="caption">Все вероятности придуманы для схемы. Для простоты слова здесь считаем целыми токенами.</p>`, 'Вероятность продолжения текста сама по себе не подтверждает истинность фразы.','Типичная авторегрессионная модель выдаёт распределение по словарю токенов. Декодирование может выбирать наиболее вероятный токен либо делать выбор с элементом случайности. Иллюстративные проценты суммируются до 100%. Они не являются оценкой фактической уверенности модели в утверждении.',['generation','transformer','errors']);

add('11 / Сборка ответа','Ответ появляется постепенно',`<p>Выбранный кусочек добавляется к тексту.</p><p>Модель учитывает его и вычисляет следующий. Так продолжается до завершения ответа.</p><p class="small">Это авторегрессионная генерация. Существуют и другие подходы к созданию текста.</p>`,`<div class="caption">Пример ответа</div><div class="answer-box" id="generated" aria-live="polite"></div><div class="actions"><button class="action" id="generate-next">Добавить следующий кусочек</button><button class="action secondary" id="generate-reset">Сначала</button></div><div id="generation-strip"></div><p class="caption" id="generate-status">Условная демонстрация. Здесь нет подключения к модели.</p>`, 'Каждый новый токен становится частью дальнейшего контекста.','В авторегрессионной генерации каждый следующий токен зависит от доступной предыдущей последовательности. Внутренние вычисления между выдачей токенов сложны. Последовательная выдача не означает, что внутри нет планирования или иных полезных вычислений. Пример работает локально и использует заранее заданные части фразы.',['generation','transformer','interp']);

add('12 / Повторное использование','Офис сохраняет часть работы',`<p>При следующем шаге можно использовать <strong>сохранённые промежуточные результаты</strong> для предыдущих карточек.</p><p>Это помогает избежать повторения части вычислений.</p><p class="small">Такое сохранение в трансформерах называют KV-кэшем.</p>`,svg(`${txt(335,35,'Следующий шаг генерации')}${[60,205,350].map((x,i)=>`${rect(x,85,115,95,'selected')}${txt(x+57,125,['Зонт','защищает','от'][i],'hint')}${txt(x+57,155,'сохранено','tiny')}`).join('')}${rect(495,85,115,95,'hot')}${txt(552,125,'дождя','hint')}${txt(552,155,'новое','tiny')}${line(117,180,117,230)}${line(262,180,262,230)}${line(407,180,407,230)}${line(117,230,407,230)}${txt(262,265,'Используем сохранённые K и V','hint')}${arrow(552,180,552,226)}${txt(552,265,'Обрабатываем','hint')}${txt(552,290,'новую позицию','hint')}`,'Предыдущие позиции используют сохранённые ключи и значения, новая позиция обрабатывается'),'Кэш ускоряет работу, но не заменяет все вычисления.','KV-кэш хранит ключи и значения attention для предыдущих позиций. При генерации новой позиции их можно использовать повторно. Внимание для новой позиции и другие вычисления всё равно выполняются. Этот кэш не равен долговременной памяти о пользователе.',['generation']);

add('13 / Память','У офиса есть разные способы помнить',`<p>Навыки сотрудников, бумаги на столе и архив выполняют <strong>разные задачи</strong>.</p><p>У модели тоже полезно различать обучение, текущий контекст и внешние записи.</p>`,`<div class="memory-row"><div class="n">1</div><div><h3>Навыки после обучения</h3><p>Параметры модели. Они определяют, как она обрабатывает информацию.</p></div></div><div class="memory-row"><div class="n">2</div><div><h3>Бумаги на столе</h3><p>Текущий контекст. Его объём ограничен, длинную историю могут сокращать.</p></div></div><div class="memory-row"><div class="n">3</div><div><h3>Внешний архив</h3><p>Файлы и сохранённые заметки. Приложение может найти их и передать модели.</p></div></div>`, 'Новое сообщение может изменить ответ без изменения параметров модели.','В обычном режиме применения модели параметры не обязаны обновляться от каждого разговора. Следование примеру или новому правилу через контекст называется in-context learning. Внешняя память реализуется окружающей системой. Отбор и сокращение контекста могут приводить к потере деталей.',['gpt3','context']);

add('14 / Сложное задание','Модель может поработать с черновиком',`<p>Задача: три коробки по четыре яблока. Два яблока отдали. Сколько осталось?</p><p>Промежуточные шаги помогают разложить решение и проверить результат.</p><p class="small">Рассуждающим моделям выделяют дополнительные вычисления перед итоговым ответом.</p>`,`<div class="paper-note" id="scratch"><p>3 коробки × 4 яблока</p><p class="hidden-step">3 × 4 = 12 яблок</p><p class="hidden-step">12 − 2 = 10 яблок</p><div class="answer hidden-step">Осталось 10 яблок</div></div><div class="actions"><button class="action" id="scratch-toggle">Показать решение</button></div><p class="caption">Это учебное объяснение. Оно не показывает реальные внутренние вычисления модели.</p>`, 'Дополнительное рассуждение может улучшать результат, ошибки всё ещё возможны.','На примере o1 показано улучшение качества сложных решений при увеличении вычислений во время ответа. DeepSeek-R1 описывает обучение рассуждению через RL. Текст объяснения не обязательно является точной записью внутренних причин ответа, что показано исследованиями интерпретируемости.',['reason','r1','interp']);

add('15 / Работа за пределами офиса','Модель использует инструменты',`<p>Офис может отправить запрос в поиск, калькулятор или программу.</p><p><strong>Инструмент выполняет действие</strong> и возвращает результат. Модель получает его и выбирает следующий шаг.</p><p class="small">Когда такие шаги организованы в цикл самостоятельной работы, систему часто называют агентом.</p>`,svg(`${rect(30,40,230,110,'selected')}${txt(145,85,'Модель')}${txt(145,117,'Выбирает действие','hint')}${rect(395,40,230,110,'box')}${txt(510,85,'Инструмент')}${txt(510,117,'Выполняет команду','hint')}${arrow(265,95,385,95)}${txt(325,72,'запрос','hint')}${rect(395,230,230,85,'hot')}${txt(510,265,'Результат')}${txt(510,292,'Число, файл, страница','hint')}${arrow(510,155,510,220)}${line(395,273,145,273,'active-wire')}${arrow(145,273,145,160)}${txt(215,253,'Обратная связь','hint')}`,'Цикл работы агента: модель выбирает инструмент, инструмент возвращает результат модели'),'Инструмент даёт новые данные, которые тоже нужно правильно использовать.','Модель формирует структурированную команду, а среда выполняет её. Агентные системы многократно используют инструменты и обратную связь. Разработчики задают права, доступные операции и условия завершения. Наличие инструмента не гарантирует корректного выбора команды и интерпретации результата.',['agents']);

add('16 / Фото и голос','Разные входы, числовые представления',`<p>Мультимодальные системы умеют работать с изображениями, звуком и другими видами данных.</p><p>Специальные части системы преобразуют входные данные в <strong>числовые представления</strong>, которые модель учится использовать.</p>`,svg(`${rect(25,25,165,85,'box')}${txt(107,63,'Текст')}${txt(107,90,'сообщение','hint')}${rect(25,142,165,85,'box')}${txt(107,181,'Фото')}${txt(107,208,'пиксели','hint')}${rect(25,259,165,85,'box')}${txt(107,298,'Звук')}${txt(107,325,'сигнал','hint')}${[67,184,301].map(y=>arrow(195,y,295,y)).join('')}${rect(310,25,155,319,'selected')}${txt(387,142,'Обработка')}${txt(387,177,'входных')}${txt(387,212,'данных')}${arrow(470,184,525,184)}${rect(540,127,100,114,'hot')}${txt(590,174,'Числа')}${txt(590,205,'для модели','tiny')}`,'Текст, фото и звук преобразуются в представления для обработки'),'Конкретное устройство зависит от модели и вида данных.','Gemini опубликована как семейство мультимодальных моделей. Подходы к обработке изображений, аудио и видео различаются, включая отдельные энкодеры и адаптеры. Схема показывает общий принцип и не утверждает, что все типы данных проходят один и тот же буквальный модуль.',['vision','llama']);

add('17 / Ошибки','Убедительный ответ может содержать выдумку',`<p>Модель способна создать связный текст, когда данных для точного ответа недостаточно.</p><p>Ошибочные или выдуманные сведения называют <strong>галлюцинациями</strong>.</p><p class="small">Для важных ответов полезны источники, пересчёт чисел и проверка результата.</p>`,svg(`${rect(30,40,600,87,'box')}${txt(330,77,'Вопрос о неизвестном событии')}${txt(330,107,'В контексте нет подтверждающих данных','hint')}${line(330,127,330,165)}${line(165,165,495,165)}${line(165,165,165,195)}${line(495,165,495,195)}${rect(25,195,280,125,'box')}${txt(165,234,'Правдоподобный текст')}${txt(165,270,'Риск выдуманных деталей','hint')}${rect(355,195,280,125,'selected')}${txt(495,234,'Поиск и проверка')}${txt(495,270,'Или признание неопределённости','tiny')}`,'Нехватка данных может привести к выдуманному ответу либо запросу проверки'),'Уверенный тон и длина объяснения не заменяют подтверждений.','Галлюцинации — ошибки содержания, включая выдуманные факты и ссылки. Обучающие и оценочные стимулы могут поощрять угадывание. Поиск и инструменты помогают проверять утверждения, но могут быть использованы неправильно. Текст рассуждений тоже требует проверки.',['errors','interp','agents']);

add('18 / Вся история на одном слайде','Как получается ответ',``, `<div class="horizontal-flow"><div class="flow-step"><div class="n">1</div><h3>Задание</h3><p>Приложение собирает запрос и нужные материалы.</p></div><div class="flow-step"><div class="n">2</div><h3>Карточки</h3><p>Текст превращается в токены и числовые представления.</p></div><div class="flow-step"><div class="n">3</div><h3>Комнаты</h3><p>Слои учитывают связи и преобразуют информацию.</p></div><div class="flow-step"><div class="n">4</div><h3>Продолжение</h3><p>Модель вычисляет вероятности следующего токена.</p></div><div class="flow-step"><div class="n">5</div><h3>Повторение</h3><p>Выбранный токен добавляется. Генерация продолжается.</p></div></div><p class="takeaway">Способности формируются при <strong>обучении</strong>. Ответ зависит от <strong>контекста</strong>. Дополнительные вычисления и инструменты могут помочь с решением.</p><div class="gloss">Офис объясняет опубликованные принципы. Люди и комнаты обозначают вычисления. Архитектура, обучение и доступные функции у разных моделей различаются.</div>`, 'Важный результат проверяют по данным и выполненным действиям.','Обобщение описанной авторегрессионной схемы трансформера. Выбор экспертов применяется только там, где используются MoE-блоки. Плотные модели работают иначе в этой части. Закрытые подробности конкретных фронтирных моделей в презентации не реконструируются.',['transformer','llama','moe','generation','agents'],{full:true});

add('19 / Чтобы проверить и узнать больше','Источники и границы объяснения',``, `<div class="sources-grid">${[['transformer','Внимание, слои и числовые представления'],['tokens','Разбиение текста на токены'],['llama','Предобучение и дообучение помощника'],['moe','Эксперты и выбор вычислительных блоков'],['reason','Дополнительные вычисления для рассуждения'],['generation','Выбор токенов и KV-кэш'],['context','История, ограничения контекста и внешние заметки'],['agents','Модель, инструменты и цикл работы агента'],['vision','Работа с текстом, изображениями и звуком'],['errors','Ошибки и выдуманные сведения']].map(([key,desc])=>`<div class="source-item"><a href="${sources[key][1]}" target="_blank" rel="noopener">${sources[key][0]}</a><p>${desc}</p></div>`).join('')}</div><p class="caption" style="margin-top:15px">Основные публикации и официальная документация. Подробности и дополнительные ссылки есть в пояснении к каждому слайду. Все числа в учебных схемах условные.</p>`, '', 'Это объяснение принципов, а не рейтинг моделей на октябрь 2026 года. Источники включают фундаментальные публикации и документированные примеры архитектур. Термин фронтирная описывает уровень возможностей на момент оценки и не задаёт единственную архитектуру. Визуальные примеры, числа и распределения придуманы для обучения. Презентация работает без интернет-подключения, внешние ссылки требуют доступа к сети.',Object.keys(sources),{full:true});

const deck=document.getElementById('deck');
deck.innerHTML=slides.map((s,i)=>`<section class="slide ${s.cover?'cover':''}" id="slide-${i+1}" data-index="${i}" aria-labelledby="title-${i}"><div class="eyebrow">${s.chapter}</div>${s.cover?'':`<h1 class="title" id="title-${i}">${s.title}</h1>`}<div class="layout ${s.full?'full':''}">${s.full?'':`<div class="copy">${s.cover?`<h1 class="title" id="title-${i}">${s.title}</h1>`:''}${s.copy}</div>`}<div class="visual">${s.visual}</div></div>${s.take?`<div class="bottomline"><span class="tag">Главная мысль</span><span>${s.take}</span></div>`:''}</section>`).join('');
document.querySelectorAll('.visual > svg.diagram, .visual > div > svg.diagram').forEach(el=>{const b=document.createElement('button');b.className='zoom-trigger';b.textContent='Увеличить схему';b.onclick=()=>{const cloned=el.outerHTML.replaceAll('arrow','zoom-arrow');document.getElementById('zoom-content').innerHTML=cloned;openOverlay('diagram-zoom')};el.after(b)});
let current=0,lastFocus=null;
const allSlides=[...document.querySelectorAll('.slide')];
function go(n,updateHash=true){current=Math.max(0,Math.min(slides.length-1,n));allSlides.forEach((el,i)=>{el.classList.toggle('active',i===current);el.setAttribute('aria-hidden',i!==current?'true':'false')});allSlides[current].scrollTop=0;document.getElementById('counter').textContent=`${String(current+1).padStart(2,'0')} / ${slides.length}`;document.getElementById('progress').style.width=`${(current+1)/slides.length*100}%`;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1;if(updateHash)history.replaceState(null,'',`#${current+1}`);document.title=`${slides[current].title} · Как работает ИИ`;}
document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);
function closeOverlay(){document.querySelectorAll('.overlay').forEach(x=>x.classList.remove('open'));if(lastFocus)lastFocus.focus();}
function openOverlay(id){lastFocus=document.activeElement;document.getElementById(id).classList.add('open');document.getElementById(id).querySelector('button').focus();}
document.getElementById('overview-open').onclick=()=>{document.getElementById('overview-list').innerHTML=slides.map((s,i)=>`<button class="overview-item ${i===current?'current':''}" data-jump="${i}"><b>${String(i+1).padStart(2,'0')}</b>${s.title}</button>`).join('');document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{go(+b.dataset.jump);closeOverlay()});openOverlay('overview')};
document.getElementById('notes-open').onclick=()=>{const s=slides[current];document.getElementById('notes-content').innerHTML=`<p>${s.notes}</p><h3>Источники</h3>${s.refs.map(k=>`<a href="${sources[k][1]}" target="_blank" rel="noopener">${sources[k][0]}</a>`).join('')}<p class="read-note">Схемы объясняют принцип. Их расположение, цвета и учебные числа не воспроизводят реальную модель.</p>`;openOverlay('notes')};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeOverlay);document.querySelectorAll('.overlay').forEach(x=>x.onclick=e=>{if(e.target===x)closeOverlay()});
document.addEventListener('keydown',e=>{const opened=document.querySelector('.overlay.open');if(opened){if(e.key==='Escape')closeOverlay();if(e.key==='Tab'){const items=[...opened.querySelectorAll('button,a')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(e.target.closest('input,textarea,select'))return;if(e.key===' '&&e.target.closest('button,a'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}if(e.key==='Home'){e.preventDefault();go(0)}if(e.key==='End'){e.preventDefault();go(slides.length-1)}});
document.getElementById('print').onclick=()=>window.print();document.getElementById('fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{document.getElementById('fullscreen').textContent='Режим недоступен'}};
window.addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1),10);if(Number.isFinite(n))go(n-1,false)});
let startX=0,startY=0;deck.addEventListener('touchstart',e=>{if(e.target.closest('button,input,a'))return;startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});deck.addEventListener('touchend',e=>{if(!startX)return;const dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.5)go(current+(dx<0?1:-1));startX=0},{passive:true});
let trainStep=0;document.getElementById('train-next').onclick=()=>{trainStep=(trainStep+1)%4;document.querySelectorAll('#train-stages .stage').forEach((x,i)=>x.classList.toggle('current',i===trainStep));document.getElementById('train-status').textContent=`Учебный цикл: шаг ${trainStep+1} из 4`};
let parts=false;function drawTokens(){const words=parts?['Маша','раскрыла','зонт','ик','.']:['Маша','раскрыла','зонтик','.'];document.getElementById('token-demo').innerHTML=words.map((w,i)=>`<div class="token ${parts&&(i===2||i===3)?'on':''}">${w}<small>место ${i+1}</small></div>`).join('');document.getElementById('token-toggle').textContent=parts?'Вернуть целое слово':'Показать части слова'}document.getElementById('token-toggle').onclick=()=>{parts=!parts;drawTokens()};drawTokens();
let layer=0;function drawCorridor(){document.getElementById('corridor').innerHTML=svg(`${[0,1,2,3].map((n)=>{let x=20+n*163;return `${rect(x,80,130,180,n===layer?'hot':'box')}${txt(x+65,125,`Комната ${n+1}`,'hint')}${txt(x+65,170,'Внимание','hint')}${txt(x+65,201,'Обработка','hint')}${n<3?arrow(x+134,170,x+157,170):''}${txt(x+65,295,n===layer?'Сейчас здесь':'','hint')}`}).join('')}${txt(330,345,'Представление обновляется после каждого слоя','hint')}`,'Последовательное прохождение четырёх условных комнат');document.getElementById('layer-status').textContent=`Комната ${layer+1} из 4`}document.getElementById('layer-next').onclick=()=>{layer=(layer+1)%4;drawCorridor()};drawCorridor();
let attention=false;document.getElementById('attention-toggle').onclick=()=>{attention=!attention;document.querySelectorAll('[data-word]').forEach(e=>{e.classList.toggle('strong',attention&&e.dataset.word==='ice');e.classList.toggle('weak',attention&&e.dataset.word!=='ice')});document.querySelectorAll('[data-att]').forEach(e=>{const isIce=e.dataset.att==='ice';e.classList.toggle('active',attention&&isIce);e.querySelector('.att-bar').style.height=attention?(isIce?'66px':'16px'):'20px'});document.getElementById('attention-toggle').textContent=attention?'Скрыть связь':'Показать связь'};
const selections=[[1,4,9],[0,6,10],[3,5,8],[2,7,11]];let room=0;function drawExperts(){document.getElementById('experts').innerHTML=Array.from({length:12},(_,i)=>`<div class="expert ${selections[room].includes(i)?'chosen':''}"><svg viewBox="0 0 45 40" aria-hidden="true">${person(22,17,selections[room].includes(i))}</svg><span>Группа ${String(i+1).padStart(2,'0')}</span></div>`).join('');document.getElementById('route-room').textContent=room+1;document.getElementById('route-status').textContent=`На этой схеме выбраны группы ${selections[room].map(n=>n+1).join(', ')}`}document.getElementById('route-next').onclick=()=>{room=(room+1)%4;drawExperts()};drawExperts();
const pieces=['Зонт',' защищает',' от',' дождя','.'];let gen=0;function drawGen(){document.getElementById('generated').innerHTML=pieces.slice(0,gen).join('')+(gen<5?'<span class="cursor" aria-hidden="true"></span>':'');document.getElementById('generation-strip').innerHTML=`<div class="token-row">${pieces.map((t,i)=>`<div class="token ${i<gen?'on':''}" style="font-size:16px;padding:10px;opacity:${i<gen?1:.35}">${i<gen?t:'…'}</div>`).join('')}</div>`;document.getElementById('generate-next').disabled=gen===5;document.getElementById('generate-status').textContent=gen===5?'Пример завершён. Части фразы заданы заранее.':`Добавлено кусочков: ${gen} из 5. Это условная демонстрация.`}document.getElementById('generate-next').onclick=()=>{gen=Math.min(5,gen+1);drawGen()};document.getElementById('generate-reset').onclick=()=>{gen=0;drawGen()};drawGen();
document.getElementById('scratch-toggle').onclick=()=>{const show=document.getElementById('scratch').classList.toggle('revealed');document.getElementById('scratch-toggle').textContent=show?'Скрыть решение':'Показать решение'};
window.addEventListener('beforeprint',()=>{allSlides.forEach(s=>s.setAttribute('aria-hidden','false'))});window.addEventListener('afterprint',()=>go(current,false));
go((parseInt(location.hash.slice(1),10)||1)-1,false);
window.deckDebug={slides,go,get current(){return current}};
</script>
</body></html>
